aid: hyperbeat
name: Hyperbeat
description: >-
  Hyperbeat is a "Liquid Banking" DeFi platform on Hyperliquid's HyperEVM, backed by Electric Capital.
  It combines a self-custodial smart wallet with saving, spending, trading, and yield in one account:
  multi-chain deposits (BTC/ETH/SOL), up to 40x leveraged trading, up to ~8% APY on idle balances, a
  crypto-collateralized credit card, and Chat & Pay. Its product suite spans Hyperbeat Pay and the USD+
  stablecoin, beHYPE liquid staking, Hyperbeat Earn vaults, delta-neutral tokens (dnHYPE/dnBTC/dnETH),
  Morphobeat money markets, MasterSwap DEX aggregation, and the Beatpot no-loss prize protocol. For
  developers and institutions it exposes a Staking API (powered by P2P.org) for programmatic HYPE
  staking, Builder Codes for beHYPE integration and revenue share, and a public Hyperliquid RPC node.
